<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Leaf - Plant Disease Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f8e9;
            color: #1b5e20;
        }

        nav {
            background: #2e7d32;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        input[type="file"] {
            margin: 25px 0;
            padding: 12px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 14px 30px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/upload">Detect Disease</a>
    <a href="/dashboard">Dashboard</a>
</nav>

<div class="container">

    <div class="card">

        <h1>🌿 Upload Plant Leaf</h1>

        <p>Select a clear image of a plant leaf.</p>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <input
                type="file"
                name="leaf_image"
                accept="image/*"
                required
            >

            <br>

            <button type="submit">
                🔍 Detect Disease
            </button>

        </form>

        <a href="/" class="back">← Back to Home</a>

    </div>

</div>

</body>
</html>
