<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detection</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            color: #1b5e20;
        }

        nav {
            background: #2e7d32;
            padding: 18px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 80px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        p {
            font-size: 18px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
        }

        .btn:hover {
            background: #1b5e20;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body>

<nav>
    <a href="/">Home</a>
    <a href="/upload">Detect Disease</a>
    <a href="/dashboard">Dashboard</a>
</nav>

<div class="container">

    <div class="card">

        <h1>🌿 Plant Disease Detection</h1>

        <p>
            Upload a plant leaf image and let our AI model
            detect possible plant diseases.
        </p>

        <a href="/upload" class="btn">
            Start Detection
        </a>

    </div>

</div>

</body>
</html>
